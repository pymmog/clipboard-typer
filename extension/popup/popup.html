<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Clipboard Typer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Clipboard Typer</h1>
      <p class="hint">Focus a text field, then type from the clipboard with human-like delays.</p>
      <button id="type" type="button">Type clipboard</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <a id="options" href="#">Settings</a>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
